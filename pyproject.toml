[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "two-body-verify"
version = "0.1.1"
description = "Verify project claims against artifacts and executable evidence."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Jason Caston"}]
dependencies = []

[project.scripts]
two-body-verify = "two_body_verify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
norecursedirs = ["tests/fixtures"]
